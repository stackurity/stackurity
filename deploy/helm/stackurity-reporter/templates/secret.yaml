{{- if .Values.secret.create }}
# The reporter adds its token here (key token) and removes the code. The
# token is not part of the chart, so upgrades keep it; uninstalling the
# release deletes it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reporter.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "reporter.labels" . | nindent 4 }}
type: Opaque
{{- with .Values.enrollCode }}
stringData:
  enroll-code: {{ . | quote }}
{{- end }}
{{- end }}
