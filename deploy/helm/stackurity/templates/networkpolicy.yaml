{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stackurity.fullname" . }}
  labels: {{- include "stackurity.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "stackurity.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 8080, protocol: TCP}]
{{- end }}
