{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stackurity.fullname" . }}
  labels: {{- include "stackurity.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "stackurity.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 8080, protocol: TCP}]
    {{- if .Values.metrics.enabled }}
    - ports: [{port: {{ .Values.metrics.port }}, protocol: TCP}]
      {{- with .Values.metrics.from }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
