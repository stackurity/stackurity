image:
  repository: ghcr.io/stackurity/stackurity
  tag: ""            # defaults to the chart appVersion
  pullPolicy: IfNotPresent

# Replicas share the database: periodic tasks and notification deliveries
# are claimed there, so more than one replica is safe (docs/install.md,
# "Running several replicas"). Sign-in rate limits are shared there too.
replicaCount: 1

# Recreate stops every replica before the new version starts, so two
# versions never share a schema during an upgrade. Mixed versions are not
# supported (migrations are not backward compatible), so never use
# RollingUpdate for a version upgrade (docs/install.md, "Upgrading"). CI
# checks that this default renders.
updateStrategy:
  type: Recreate

# Prometheus metrics on a separate port and Service (never the ingress).
# The endpoint has no authentication; restrict who can reach it.
metrics:
  enabled: false
  port: 9100
  # With networkPolicy.enabled, the peers allowed to scrape (e.g. a
  # namespaceSelector for your monitoring namespace). Empty allows any pod.
  from: []
  # A ServiceMonitor for the Prometheus Operator. It is rendered only when
  # the cluster serves monitoring.coreos.com/v1 (with helm template, pass
  # --api-versions monitoring.coreos.com/v1/ServiceMonitor).
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: ""    # defaults to Prometheus's own
    # Extra labels, e.g. {release: kube-prometheus-stack}, so your
    # Prometheus's serviceMonitorSelector picks it up.
    labels: {}
  # The recommended alerts (deploy/prometheus/stackurity-alerts.yml, runbooks
  # in docs/operations.md) as a PrometheusRule. Rendered only when the cluster
  # serves monitoring.coreos.com/v1 (with helm template, pass
  # --api-versions monitoring.coreos.com/v1/PrometheusRule). StackurityTargetDown
  # matches scrape jobs whose name contains "stackurity", as the
  # ServiceMonitor's job (the <release>-stackurity-metrics Service) does.
  prometheusRule:
    enabled: false
    # Extra labels, e.g. {release: kube-prometheus-stack}, so your
    # Prometheus's ruleSelector picks it up.
    labels: {}

# PostgreSQL 16+ is required and not bundled. Point at a managed database or
# an operator such as CloudNativePG.
database:
  existingSecret: ""     # Secret with the connection URL
  existingSecretKey: url # postgres://user:pass@host:5432/stackurity?sslmode=require

# The server's free key (or a paid licence key) from a Secret, as
# STACKURITY_LICENSE: https://app.stackurity.dev/self-hosted-key, checked
# offline (docs/install.md, "The free key"). Empty: enter it in the
# dashboard instead, which keeps it in the database.
license:
  existingSecret: ""
  existingSecretKey: key

config:
  baseURL: ""            # public URL, used in notification links
  cookieSecure: true
  trustProxy: true       # behind an ingress controller
  # The header the ingress controller overwrites with the client address,
  # read only from trustedProxies; X-Forwarded-For is read from the right.
  # CF-Connecting-IP when Cloudflare is in front.
  trustedProxyHeader: X-Forwarded-For
  trustedProxies: ""     # CIDRs; empty is loopback and the private ranges
  feeds: "on"            # "off" for air-gapped installs (see docs/network.md)
  staleAfter: 48h
  logFormat: json
  platformWorkspace: ""  # id or slug for platform incidents; empty is workspace 1
  extraEnv: {}           # e.g. STACKURITY_OSV_URL for a mirror

# Secrets referenced by integrations and channels (env:STACKURITY_SECRET_*
# or file:/run/secrets/<name>). Each entry mounts one key of an existing
# Secret as a file under /run/secrets.
secretFiles: []
#  - name: github_token
#    secret: stackurity-integrations
#    key: github_token

plugins:
  # Extra plugins from a volume (the image ships aws-managed).
  extraVolume: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: stackurity.example.com
  tls: []

resources:
  requests: {cpu: 200m, memory: 512Mi}
  limits: {memory: 2Gi}

# Scratch space for repository clones and feed archives (Ubuntu's OSV
# archive is ~750 MB during first sync).
scratch:
  sizeLimit: 4Gi

networkPolicy:
  enabled: false
  # Egress is needed for feeds, Git, registries and notifications; restrict
  # with your own egress policy or proxy.

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

nodeSelector: {}
tolerations: []
affinity: {}
