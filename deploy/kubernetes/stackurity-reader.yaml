# Least-privilege, read-only access for the Stackurity Kubernetes plugin.
# See docs/kubernetes.md. Apply with:
#
#   kubectl apply -f stackurity-reader.yaml
#
# It grants get/list/watch on the objects the plugin reads and nothing else:
# no Secrets, ConfigMaps, exec, logs or write verbs. The token Secret at the
# end gives a long-lived token for a Stackurity server outside the cluster;
# leave it out when Stackurity runs in the cluster with this service account.
apiVersion: v1
kind: Namespace
metadata:
  name: stackurity
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stackurity-reader
  namespace: stackurity
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stackurity-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stackurity-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stackurity-reader
subjects:
  - kind: ServiceAccount
    name: stackurity-reader
    namespace: stackurity
---
# Long-lived token for an external Stackurity server. Read it with:
#   kubectl -n stackurity get secret stackurity-reader-token -o jsonpath='{.data.token}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: stackurity-reader-token
  namespace: stackurity
  annotations:
    kubernetes.io/service-account.name: stackurity-reader
type: kubernetes.io/service-account-token
