# Slack app manifest for the Stackurity Slack app ("Add to Slack").
#
# Paste it at https://api.slack.com/apps -> Create New App -> From an app
# manifest. It is written for Stackurity Cloud (https://app.stackurity.ai);
# on your own server, replace https://app.stackurity.ai with your
# STACKURITY_BASE_URL in the three URLs and delete the second redirect URL.
# Then follow docs/slack-app.md.
display_information:
  name: Stackurity
  description: Security notifications from Stackurity, with Assign to me and Snooze buttons.
  long_description: Stackurity tells your team about new urgent issues, issues that came back after a fix, overdue fixes and daily or weekly summaries, grouped per check and per fix, never one message per issue. Each fix has buttons to assign it to yourself or snooze it from Slack after you link your Slack account once. Stackurity posts only to the channel you pick when you add the app.
  background_color: "#1f2937"
features:
  bot_user:
    display_name: Stackurity
    always_online: false
oauth_config:
  redirect_urls:
    - https://app.stackurity.ai/integrations/slack/oauth/callback
    # Stackurity Cloud's previous address, while it still routes to the
    # server: remove it when app.stackurity.dev is retired.
    - https://app.stackurity.dev/integrations/slack/oauth/callback
  scopes:
    bot:
      # The channel picker on Slack's consent page and that channel's
      # webhook. Interactivity and the uninstall events need no scope.
      - incoming-webhook
settings:
  event_subscriptions:
    request_url: https://app.stackurity.ai/api/v1/integrations/slack/events
    bot_events:
      - app_uninstalled
      - tokens_revoked
  interactivity:
    is_enabled: true
    request_url: https://app.stackurity.ai/api/v1/integrations/slack/actions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
# Direct install (installs started from the Slack Marketplace listing): Slack
# sends people to this URL, which must answer with a 302 to Slack's consent
# page; Stackurity's does, and lets them pick the organisation when signed
# in. It applies once the app is listed in the Slack Marketplace; it can also
# be set under Basic Information -> Installing Your App. See
# docs/slack-app.md#installs-started-from-slack.
# app_directory:
#   use_direct_install: true
#   direct_install_url: https://app.stackurity.ai/integrations/slack/install
