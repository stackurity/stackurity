name: fuzz

# Long fuzzing is opt-in: run it by hand (Actions > fuzz > Run workflow).
# The seed corpus of every target already runs in the normal test job.
on:
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per target (Go duration)
        default: 5m

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./internal/sbom, name: FuzzImport }
          - { pkg: ./internal/collect/lockfile, name: FuzzLockfiles }
          - { pkg: ./internal/osv, name: FuzzRecord }
          - { pkg: ./internal/osv, name: FuzzComparators }
          - { pkg: ./internal/intel, name: FuzzParseUpdateInfo }
          - { pkg: ./internal/plugins, name: FuzzPluginBatches }
          - { pkg: ./internal/model, name: FuzzBatch }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz ${{ matrix.target.name }}
        run: go test -run '^$' -fuzz='^${{ matrix.target.name }}$' -fuzztime='${{ inputs.fuzztime }}' ${{ matrix.target.pkg }}
      - name: Keep failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target.name }}
          path: '**/testdata/fuzz/**'
