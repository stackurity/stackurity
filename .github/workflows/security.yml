# Security checks on Stackurity itself (PRD §11, FR-18). These run static
# analysis and dependency scanning only; nothing from the repository is
# executed beyond the normal build.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"   # daily, to catch newly published advisories the same day

permissions:
  contents: read

jobs:
  # govulncheck, npm audit and the image scan; blocking.
  gate:
    uses: ./.github/workflows/security-gate.yml

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: OSV-Scanner on lockfiles
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          # Go reachability is checked by the gate's govulncheck job with the
          # project's toolchain; the scanner image's older Go cannot load it.
          scan-args: |-
            --no-call-analysis=go
            --config=osv-scanner.toml
            --lockfile=go.mod
            --lockfile=web/package-lock.json

  static-analysis:
    # Code scanning uploads need a public repository (or GitHub Advanced
    # Security on a private one); until the repo is public this is skipped.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with: {languages: "go, javascript-typescript"}
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1

  dogfood:
    # Stackurity inventories its own lockfiles; the batch is kept as an
    # artifact so releases have a reviewable dependency record.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod}
      - run: go run ./cmd/stackurity scan . --name stackurity -o stackurity-inventory.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: stackurity-inventory, path: stackurity-inventory.json}
