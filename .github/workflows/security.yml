# Security checks on Stackurity itself (PRD §11, FR-18). These run static
# analysis and dependency scanning only; nothing from the repository is
# executed beyond the normal build.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly, to catch newly published advisories

permissions:
  contents: read

jobs:
  go-vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - name: govulncheck (reachable vulnerabilities only)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OSV-Scanner on lockfiles
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          # Go reachability is checked by the go-vulnerabilities job with the
          # project's toolchain; the scanner image's older Go cannot load it.
          scan-args: |-
            --no-call-analysis=go
            --config=osv-scanner.toml
            --lockfile=go.mod
            --lockfile=web/package-lock.json
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: npm audit (runtime dependencies)
        run: cd web && npm audit --omit=dev --audit-level=high

  static-analysis:
    # Code scanning uploads need a public repository (or GitHub Advanced
    # Security on a private one); until the repo is public this is skipped.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: {languages: "go, javascript-typescript"}
      - uses: github/codeql-action/analyze@v3

  dogfood:
    # Stackurity inventories its own lockfiles; the batch is kept as an
    # artifact so releases have a reviewable dependency record.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - run: go run ./cmd/stackurity scan . --name stackurity -o stackurity-inventory.json
      - uses: actions/upload-artifact@v4
        with: {name: stackurity-inventory, path: stackurity-inventory.json}
