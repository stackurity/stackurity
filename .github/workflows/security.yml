# Security checks on Stackurity itself (PRD §11, FR-18). These run static
# analysis and dependency scanning only; nothing from the repository is
# executed beyond the normal build.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"   # daily, to catch newly published advisories the same day
  workflow_dispatch:

# A new push to a pull request cancels its older run.
concurrency:
  group: security-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # govulncheck, npm audit and the image scan; blocking.
  gate:
    uses: ./.github/workflows/security-gate.yml
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # What Docker Hub users actually pull. A fix published after the last
  # release (an Alpine package, a Go module) fails this run, which means:
  # cut a patch release the same day.
  published-image:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy on docker.io/stackurity/stackurity:latest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: docker.io/stackurity/stackurity:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml
      - name: Docker Scout on docker.io/stackurity/stackurity:latest
        if: ${{ !cancelled() }}
        uses: docker/scout-action@a4119c5a8c5076236a54e4ce99531f7e4dd2ef84 # v1.27.0
        with:
          command: cves
          image: registry://docker.io/stackurity/stackurity:latest
          only-fixed: true
          only-severities: critical,high
          ignore-base: true
          ignore-suppressed: true
          vex-location: .vex
          exit-code: true
          summary: true
          write-comment: false
          dockerhub-user: stackurity
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: OSV-Scanner on lockfiles
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          # Go reachability is checked by the gate's govulncheck job with the
          # project's toolchain; the scanner image's older Go cannot load it.
          scan-args: |-
            --no-call-analysis=go
            --config=osv-scanner.toml
            --lockfile=go.mod
            --lockfile=web/package-lock.json

  static-analysis:
    # Code scanning uploads need a public repository (or GitHub Advanced
    # Security on a private one); until the repo is public this is skipped.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with: {languages: "go, javascript-typescript", config-file: ./.github/codeql/codeql-config.yml}
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  dogfood:
    # Stackurity inventories its own lockfiles; the batch is kept as an
    # artifact so releases have a reviewable dependency record.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod}
      - run: go run ./cmd/stackurity scan . --name stackurity -o stackurity-inventory.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: stackurity-inventory, path: stackurity-inventory.json}
