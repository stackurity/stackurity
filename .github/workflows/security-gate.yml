# The vulnerability gate: nothing ships with a known fixable HIGH or
# CRITICAL vulnerability. Called on every pull request and push to main
# (security.yml) and by release.yml before anything is published.
#
# Exceptions, each with a reason and an expiry:
#   Go       govulncheck fails only on vulnerabilities the code can reach;
#            module-level notes without a fix are recorded in osv-scanner.toml.
#   npm      web/audit-allow.json (tools/npm-audit-gate)
#   image    .trivyignore.yaml (Trivy); for Docker Scout, an OpenVEX
#            statement in .vex/ or an exception in the Docker Scout
#            dashboard, each with a reason.
#
# The image is scanned by two scanners, Trivy and Docker Scout, because
# their advisory data differ: on 6 Nov 2026 Trivy passed v0.19.2 while
# Scout (what Docker Hub shows) reported a critical brotli and a high
# klauspost/compress in Syft. Scout ignores the base image's own packages
# (ignore-base): the Dockerfile runs `apk upgrade`, so any fix Alpine has
# shipped is already in, and Trivy (Alpine's own security data, unfixed
# ignored) still fails on base packages with a published fix.
name: security-gate

on:
  workflow_call:
    secrets:
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod}
      - name: govulncheck (reachable vulnerabilities)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22}
      - name: npm audit, high and critical (runtime and build dependencies)
        run: node tools/npm-audit-gate/gate.mjs web web/audit-allow.json

  image:
    runs-on: ubuntu-latest
    env:
      SCOUT_LOGIN: ${{ secrets.DOCKERHUB_TOKEN != '' && 'yes' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: stackurity:gate
      - name: Scan the image (fixable HIGH and CRITICAL fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: stackurity:gate
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml
      # Docker Scout needs a Docker Hub login; pull requests from forks get
      # no secrets, so it is skipped there and Trivy alone gates them.
      - name: Scan the image with Docker Scout (fixable HIGH and CRITICAL fail)
        if: ${{ env.SCOUT_LOGIN != '' }}
        uses: docker/scout-action@a4119c5a8c5076236a54e4ce99531f7e4dd2ef84 # v1.27.0
        with:
          command: cves
          image: local://stackurity:gate
          only-fixed: true
          only-severities: critical,high
          ignore-base: true
          ignore-suppressed: true
          vex-location: .vex
          exit-code: true
          summary: true
          write-comment: false
          dockerhub-user: stackurity
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
