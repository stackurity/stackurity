name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the release
  packages: write      # push the image to GHCR
  id-token: write      # keyless signing with Sigstore
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}

      - name: Build dashboard
        run: cd web && npm ci --ignore-scripts && npm run build

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/stackurity_${VERSION}_${os}_${arch}${ext}" ./cmd/stackurity
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o "dist/stackurity-plugin-aws-managed_${VERSION}_${os}_${arch}${ext}" ./plugins/aws-managed
          done
          cd dist && sha256sum * > SHA256SUMS

      - name: Source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/stackurity_${{ github.ref_name }}_source.cdx.json

      - uses: sigstore/cosign-installer@v3
      - name: Sign checksums (keyless)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/stackurity_*

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/stackurity:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/stackurity:latest
          sbom: true
          provenance: mode=max
      - name: Sign image (keyless)
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/stackurity@${{ steps.image.outputs.digest }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --verify-tag --generate-notes \
            --title "Stackurity ${{ github.ref_name }}"
