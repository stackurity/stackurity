name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the release
  packages: write      # push the image to GHCR
  id-token: write      # keyless signing with Sigstore
  attestations: write

jobs:
  # A tag publishes nothing unless the current build upgrades, restores and
  # rolls back cleanly from earlier releases.
  checks:
    uses: ./.github/workflows/release-checks.yml
    permissions:
      contents: read

  # Nothing is published with a known fixable HIGH or CRITICAL
  # vulnerability: govulncheck, npm audit and a scan of the built image.
  security:
    uses: ./.github/workflows/security-gate.yml
    permissions:
      contents: read

  release:
    needs: [checks, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}

      # Every release has notes: the CHANGELOG.md section for the tag. A tag
      # without one fails here, before anything is built or published.
      - name: Release notes from CHANGELOG.md
        run: go run ./tools/changelog -version "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - name: Version references match the tag
        run: STACKURITY_RELEASE_TAG="$GITHUB_REF_NAME" go test -count=1 ./tools/releaselint

      - name: Build dashboard
        run: cd web && npm ci --ignore-scripts && npm run build

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/stackurity_${VERSION}_${os}_${arch}${ext}" ./cmd/stackurity
            for plugin in aws-managed gcp-managed azure-managed kubernetes; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" \
                -o "dist/stackurity-plugin-${plugin}_${VERSION}_${os}_${arch}${ext}" ./plugins/$plugin
            done
          done
          cd dist && sha256sum * > SHA256SUMS

      - name: Source SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/stackurity_${{ github.ref_name }}_source.cdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksums (keyless)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/stackurity_*

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: stackurity
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image version
        id: ver
        # The Helm chart pulls the version without the "v" (appVersion 0.2.0).
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/stackurity:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/stackurity:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/stackurity:latest
            docker.io/stackurity/stackurity:${{ github.ref_name }}
            docker.io/stackurity/stackurity:${{ steps.ver.outputs.version }}
            docker.io/stackurity/stackurity:latest
          sbom: true
          provenance: mode=max
      - name: Sign image (keyless)
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/stackurity@${{ steps.image.outputs.digest }}"
          cosign sign --yes "docker.io/stackurity/stackurity@${{ steps.image.outputs.digest }}"

      - name: Publish and sign the Helm charts
        # helm install oci://ghcr.io/stackurity/charts/stackurity --version <x.y.z>
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin
          # The server's chart, and the Kubernetes reporter's
          # (helm install stackurity-reporter oci://ghcr.io/stackurity/charts/stackurity-reporter).
          for chart in stackurity stackurity-reporter; do
            helm package "deploy/helm/$chart" --version "$v" --app-version "$v" -d dist-chart
            out=$(helm push "dist-chart/$chart-$v.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts" 2>&1 | tee /dev/stderr)
            digest=$(printf '%s\n' "$out" | sed -n 's/^Digest: //p')
            cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/$chart@$digest"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag such as v0.4.0-rc.1 is published as a prerelease, which
          # installations' update checks ignore.
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag $pre \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --title "Stackurity $GITHUB_REF_NAME"

  # The tap's own schedule runs only every few hours on a quiet repository,
  # so start its update now. HOMEBREW_TAP_TOKEN may only run workflows in
  # stackurity/homebrew-tap; without it (forks) this is skipped. The tap
  # verifies the release's signature and tests the formula before committing.
  homebrew:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Update the Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; the tap updates on its own schedule"
            exit 0
          fi
          gh workflow run update.yml -R stackurity/homebrew-tap -f version="$GITHUB_REF_NAME"

  # Tell the website a release is out, so it can update the version, the
  # release notes and the download links it shows. WEBSITE_DISPATCH_TOKEN
  # may only send repository_dispatch events to stackurity/website (a
  # fine-grained token with Contents: read and write on that repository);
  # without it (forks) this is skipped with a warning and the release
  # still succeeds. The website repository handles the stackurity-release
  # event.
  website:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify the website
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::WEBSITE_DISPATCH_TOKEN is not set; update the website by hand for $GITHUB_REF_NAME"
            exit 0
          fi
          gh api repos/stackurity/website/dispatches -f event_type=stackurity-release \
            -f "client_payload[version]=${GITHUB_REF_NAME#v}" -f "client_payload[tag]=$GITHUB_REF_NAME"

  # Start the licensed (ee,cloud) image build in the private stackurity-pro
  # repository: its ee-image workflow, run on its main, builds this tag with
  # the pro commit tagged the same, scans, pushes, signs and attests it.
  # It waits for the same gates as the release (upgrade, restore, rollback,
  # isolation and the vulnerability gate), not for publishing, so the
  # production image is ready about when the release is (RELEASING.md).
  # PRO_DISPATCH_TOKEN is a fine-grained token for stackurity/stackurity-pro
  # only with Actions: read and write (it can run that repository's
  # workflows, not read or change its code); without it (forks) this is
  # skipped with a warning and the release still succeeds. Prereleases are
  # built by hand there if needed.
  pro-image:
    needs: [checks, security]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Start the stackurity-ee image build
        env:
          GH_TOKEN: ${{ secrets.PRO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PRO_DISPATCH_TOKEN is not set; run ee-image.yml in stackurity-pro by hand with core_tag=$GITHUB_REF_NAME"
            exit 0
          fi
          gh workflow run ee-image.yml -R stackurity/stackurity-pro --ref main -f "core_tag=$GITHUB_REF_NAME"
