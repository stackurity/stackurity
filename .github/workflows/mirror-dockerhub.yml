name: mirror-dockerhub

# Copies a published release image from GHCR to Docker Hub unchanged (the
# same multi-platform index, attestations included) and signs it there.
# Releases push to both registries; this is for releases published before
# Docker Hub was added, or to repair a failed push.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release to copy, for example 0.5.0
        required: true

permissions:
  contents: read
  packages: read
  id-token: write   # keyless signing

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: stackurity
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Verify the source, copy and sign
        env:
          V: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$V" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::version must look like 0.5.0"; exit 1 ;; esac
          src="ghcr.io/stackurity/stackurity:$V"
          # Only an image this repository's release workflow signed is copied.
          cosign verify "$src" --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github.com/stackurity/stackurity/.github/workflows/release.yml@refs/tags/' > /dev/null
          docker buildx imagetools create -t "docker.io/stackurity/stackurity:$V" -t "docker.io/stackurity/stackurity:v$V" "$src"
          latest=$(gh release view --repo stackurity/stackurity --json tagName --jq .tagName)
          if [ "$latest" = "v$V" ]; then
            docker buildx imagetools create -t docker.io/stackurity/stackurity:latest "$src"
          fi
          digest=$(docker buildx imagetools inspect "docker.io/stackurity/stackurity:$V" --format '{{.Manifest.Digest}}')
          case "$digest" in sha256:*) ;; *) echo "::error::no digest for the copied image"; exit 1 ;; esac
          cosign sign --yes "docker.io/stackurity/stackurity@$digest"
          echo "copied $src to docker.io/stackurity/stackurity:$V ($digest)"
