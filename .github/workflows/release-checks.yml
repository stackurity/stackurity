# Release checks against real installations of earlier releases: upgrade
# with data in place, backup and restore into a new PostgreSQL server, and
# the documented rollback (restore the pre-upgrade backup, start the
# previous image). See tools/release-checks/upgrade.sh. Also the workspace
# isolation suite (tools/release-checks/isolation.sh): any failure there
# blocks the release. The release workflow runs these too, before anything
# is published.
name: release-checks

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Called from the
# release workflow, the group is that run's own and nothing is cancelled.
concurrency:
  group: release-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the upgrade checks need to run: always for a release, and for a
  # pull request unless it only changes the dashboard's front end, the
  # documentation or the browser tests, which cannot change an upgrade.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      upgrade: ${{ steps.c.outputs.upgrade }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: c
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo upgrade=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD is the pull request merged into its base; HEAD^1 is the base.
          other=$(git diff --name-only HEAD^1 HEAD | grep -Ev '^(web/|docs/|tests/ui/)|\.md$' || true)
          if [ -n "$other" ]; then
            echo "Upgrade checks run: $(echo "$other" | wc -l) files outside web/, docs/, tests/ui/ and Markdown changed"
            echo upgrade=true >> "$GITHUB_OUTPUT"
          else
            echo "Upgrade checks skipped: only web/, docs/, tests/ui/ or Markdown changed"
            echo upgrade=false >> "$GITHUB_OUTPUT"
          fi

  # Workspace isolation: one workspace never sees or changes another's data,
  # and the database enforces it. A failure, a skip or a test that no longer
  # exists fails this job, which blocks the pull request and the release
  # (docs/security-audit.md, "Tenant-isolation incidents").
  isolation:
    name: Workspace isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_USER: stackurity
          POSTGRES_PASSWORD: stackurity
          POSTGRES_DB: stackurity_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stackurity" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      STACKURITY_TEST_DATABASE_URL: postgres://stackurity:stackurity@localhost:5432/stackurity_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: tools/release-checks/isolation.sh

  image:
    name: Build the current image
    needs: changes
    if: needs.changes.outputs.upgrade == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30   # image now bundles the Windows and macOS agents; v0.15.0 hit 15 min with every step green
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: stackurity:release-check
          cache-from: type=gha,scope=release-check
          cache-to: type=gha,mode=max,scope=release-check
      - run: docker save stackurity:release-check | gzip -1 > image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-check-image
          path: image.tar.gz
          retention-days: 1

  upgrade:
    name: Upgrade, restore and rollback from ${{ matrix.from }}
    needs: image
    if: needs.image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Published releases a site may upgrade from. Add each new minor.
        from: ["0.2.0", "0.3.0", "0.3.1", "0.4.0", "0.5.0", "0.5.1", "0.6.0", "0.8.0", "0.9.0", "0.10.0", "0.11.0", "0.12.0", "0.13.0", "0.13.1", "0.13.2", "0.13.3", "0.13.4", "0.13.5", "0.13.6", "0.13.7", "0.13.8", "0.13.9", "0.14.0", "0.14.1", "0.15.0", "0.16.0", "0.17.0", "0.17.1", "0.18.0", "0.18.1", "0.19.0", "0.19.1", "0.19.2", "0.19.3", "0.19.4", "0.19.5", "0.19.6"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-check-image
      - run: gunzip -c image.tar.gz | docker load
      - run: docker pull -q ghcr.io/stackurity/stackurity:${{ matrix.from }}
      - name: Upgrade, backup and restore, rollback
        run: tools/release-checks/upgrade.sh ghcr.io/stackurity/stackurity:${{ matrix.from }} stackurity:release-check
