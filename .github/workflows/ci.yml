name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # The Go tests in shards, each on its own runner and PostgreSQL
  # (tools/ci/go-test-shard.sh): internal/api took 20 minutes of a
  # 25-minute run when every package shared one runner and database.
  go-test:
    name: go (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: api 1/3, args: api 1 3}
          - {shard: api 2/3, args: api 2 3}
          - {shard: api 3/3, args: api 3 3}
          - {shard: intel, args: pkg ./internal/intel}
          - {shard: store, args: pkg ./internal/store}
          - {shard: notify, args: pkg ./internal/notify}
          - {shard: rest, args: rest, lint: true}
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_USER: stackurity
          POSTGRES_PASSWORD: stackurity
          POSTGRES_DB: stackurity_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stackurity" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      STACKURITY_TEST_DATABASE_URL: postgres://stackurity:stackurity@localhost:5432/stackurity_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        if: matrix.lint
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - if: matrix.lint
        run: go vet ./...
      - run: tools/ci/go-test-shard.sh ${{ matrix.args }}
      - name: Cross-compile (Windows agent, plugins)
        if: matrix.lint
        run: |
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/stackurity
          go build -o /dev/null ./plugins/... ./examples/...

  # The required check: passes when every shard passed.
  go:
    if: always()
    needs: go-test
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.go-test.result }}" = success

  # Documentation and release metadata in step with the code, as its own
  # check so a failure says what drifted: every environment variable, CLI
  # command and flag, and API route is documented (tools/docslint,
  # TestCLIDocumented), version references name the newest release and the
  # upgrade matrix includes it (tools/releaselint). The go job runs these
  # too; this one needs no database and finishes in seconds.
  docs:
    name: Docs and release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./tools/docslint ./tools/releaselint
      # The licensed build's modules (tools/eedeps) are still in go.mod and
      # go.sum: go mod tidy cannot see stackurity-pro's imports.
      - run: go test -count=1 ./tools/eedeps
      - run: go test -count=1 -run TestCLIDocumented ./cmd/stackurity

  # Kills the real server with SIGKILL during a feed import, an ingest, a
  # notification send, a periodic task and a job, restarts it and checks the
  # outcome (docs/reliability.md); cuts it off from PostgreSQL mid-sync and
  # mid-send, and runs the operational drills of docs/operations.md
  # (upstream outage, failing notification provider, silent agent). Each
  # scenario gets its own database.
  crash:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_USER: stackurity
          POSTGRES_PASSWORD: stackurity
          POSTGRES_DB: stackurity_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stackurity" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      STACKURITY_TEST_DATABASE_URL: postgres://stackurity:stackurity@localhost:5432/stackurity_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet -tags crash ./internal/crashtest
      - name: Crash tests
        run: go test -tags crash -count=1 -v -timeout 20m ./internal/crashtest

  # The recommended alerts (deploy/prometheus/stackurity-alerts.yml): syntax
  # and unit tests with promtool from a pinned Prometheus release, verified
  # against its published checksum. rules_test.go (in the go job) keeps the
  # Helm chart's copy, the runbook and the metric names in step.
  alerts:
    runs-on: ubuntu-latest
    env:
      PROMETHEUS_VERSION: 3.5.0
      PROMETHEUS_SHA256: e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install promtool
        run: |
          f=prometheus-$PROMETHEUS_VERSION.linux-amd64
          curl -sSfLO "https://github.com/prometheus/prometheus/releases/download/v$PROMETHEUS_VERSION/$f.tar.gz"
          echo "$PROMETHEUS_SHA256  $f.tar.gz" | sha256sum -c -
          tar xzf "$f.tar.gz" "$f/promtool"
          sudo install "$f/promtool" /usr/local/bin/promtool
      - run: promtool check rules deploy/prometheus/stackurity-alerts.yml
      - run: cd deploy/prometheus && promtool test rules stackurity-alerts_test.yml

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Browser checks over every route of the dashboard (tests/ui/layout.mjs):
  # the sidebar covers the screen, no empty band at the bottom, no
  # horizontal scroll where routes.mjs asks. The server runs with the demo
  # estate and feeds off (no internet), signed in as a test admin.
  ui:
    # Pinned: Playwright has no Chromium build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_USER: stackurity
          POSTGRES_PASSWORD: stackurity
          POSTGRES_DB: stackurity
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stackurity" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      STACKURITY_DATABASE_URL: postgres://stackurity:stackurity@localhost:5432/stackurity?sslmode=disable
      STACKURITY_LISTEN: 127.0.0.1:8080
      STACKURITY_BASE_URL: http://127.0.0.1:8080
      STACKURITY_COOKIE_SECURE: "false"
      STACKURITY_FEEDS: "off"
      STACKURITY_DATA_DIR: /tmp/stackurity
      # A free Community key ("Stackurity CI", from the free-key issuer): a
      # self-hosted server waits for one before the dashboard opens. Anyone
      # can get one; it unlocks nothing paid.
      STACKURITY_LICENSE: eyJ2IjoxLCJpZCI6ImNrX2NiY2Q1ZDk3YTkzMmRlNmIiLCJjdXN0b21lciI6IlN0YWNrdXJpdHkgQ0kiLCJuYW1lIjoiU3RhY2t1cml0eSBDSSIsImVkaXRpb24iOiJjb21tdW5pdHkiLCJtYXhfYXNzZXRzIjowLCJpc3N1ZWRfYXQiOiIyMDI2LTExLTAxVDE3OjQ4OjIwWiIsImV4cGlyZXNfYXQiOiIyMTI2LTEwLTA4VDE3OjQ4OjIwWiJ9.ZwnzCfVB4Yt_o-o4ziglboCXWIrZhkIp_kgnNyysRZXmfnRcsw9SFkZmoy2GokuMc62J8z_5NeM9jKIiV6FiCQ
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/ui/package-lock.json
      - run: cd web && npm ci --ignore-scripts && npm run build
      - run: go build -o /tmp/stackurity ./cmd/stackurity
      - name: Start the server with the demo estate
        run: |
          STACKURITY_PASSWORD=ui-test-password-1 /tmp/stackurity admin create-user --email ui@example.com --name UI --role admin
          /tmp/stackurity admin load-demo
          /tmp/stackurity server > /tmp/server.log 2>&1 &
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
      - run: cd tests/ui && npm ci --ignore-scripts && npx playwright install --with-deps chromium
      - run: cd tests/ui && node layout.mjs http://127.0.0.1:8080
      - if: failure()
        run: tail -100 /tmp/server.log

  image:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t stackurity:ci .
      - name: Agent builds are readable by the server user
        run: docker run --rm --entrypoint sh stackurity:ci -c 'cd "$STACKURITY_AGENT_DIR" && sha256sum -c stackurity-linux-amd64.sha256 stackurity-linux-arm64.sha256 stackurity-darwin-amd64.sha256 stackurity-darwin-arm64.sha256 stackurity-windows-amd64.sha256'

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint deploy/helm/stackurity --set database.existingSecret=db
      - name: The Kubernetes reporter chart lints and renders
        run: |
          set -euo pipefail
          helm lint deploy/helm/stackurity-reporter --set server=https://stackurity.example.com --set enrollCode=enr_x
          helm template r deploy/helm/stackurity-reporter --set server=https://stackurity.example.com > reporter.yaml
          helm template r deploy/helm/stackurity-reporter --set server=https://stackurity.example.com \
            --set rbac.clusterWide=false --set 'namespaces={shop,blog}' > reporter-ns.yaml
          grep -q 'kind: ClusterRoleBinding' reporter.yaml
          test "$(grep -c '^kind: Role$' reporter-ns.yaml)" = 3
      # deploy/kubernetes/reporter_test.go renders the chart with Go's
      # text/template everywhere; with helm installed it checks the same
      # renders with helm template too, so it runs here as well.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod}
      - run: go test -count=1 ./deploy/kubernetes
      - name: Default update strategy is Recreate (versions are never mixed during an upgrade)
        run: |
          set -euo pipefail
          helm template stackurity deploy/helm/stackurity --set database.existingSecret=db --set replicaCount=3 \
            --show-only templates/deployment.yaml > deployment.yaml
          # The Deployment's own strategy block, exactly: nothing but type: Recreate.
          strategy=$(awk '/^  strategy:/{f=1; next} f && /^    /{print; next} f{exit}' deployment.yaml)
          echo "spec.strategy: $strategy"
          [ "$strategy" = "    type: Recreate" ] || { echo "::error::the chart's default spec.strategy must be type: Recreate"; exit 1; }
      - name: PrometheusRule renders the recommended alerts
        run: |
          helm template t deploy/helm/stackurity --set database.existingSecret=db \
            --set metrics.enabled=true --set metrics.prometheusRule.enabled=true \
            --api-versions monitoring.coreos.com/v1/PrometheusRule --show-only templates/prometheusrule.yaml > rule.yaml
          grep -q 'alert: StackurityDatabaseDown' rule.yaml
          test -z "$(helm template t deploy/helm/stackurity --set database.existingSecret=db --set metrics.enabled=true \
            --set metrics.prometheusRule.enabled=true | grep PrometheusRule)"
